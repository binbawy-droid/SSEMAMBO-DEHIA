name: Refresh remote jobs feed

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-remote-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh syndicated job listings
        run: node scripts/refresh-remote-jobs.mjs
      - name: Commit updated feed when changed
        run: |
          if git diff --quiet -- data/remote-jobs.json; then
            echo "No listing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/remote-jobs.json
          git commit -m "Refresh remote jobs feed"
          git push
